<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Teleprompter">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>Teleprompter</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div id="zona-camara">
    <video id="video-camara" autoplay playsinline muted></video>
    <p id="mensaje-camara" role="alert" hidden></p>
    <span id="indicador-grabando" hidden>● Grabando</span>
  </div>
  <div id="zona-texto">
    <div id="teleprompter-contenedor">
      <div id="teleprompter-texto"></div>
    </div>
  </div>
  <div id="zona-controles">
    <!-- T12, punto 1: dos botones grandes y prominentes que se turnan en el
         mismo lugar — "Activar cámara" se oculta y "Grabar" aparece en su
         lugar tras el primer gesto de usuario exitoso (getUserMedia). Los
         demás controles arrancan disabled y solo se habilitan cuando
         getUserMedia resuelve con éxito (ver js/camara.js). -->
    <button id="btn-activar-camara" type="button" class="boton-principal">Activar cámara</button>
    <button id="btn-grabar" type="button" class="boton-principal" hidden>Grabar</button>
    <button id="btn-alternar-config" type="button" disabled>⚙ Configuración</button>
  </div>

  <div id="panel-config" hidden>
    <button id="btn-modo-voz" type="button" aria-pressed="true" disabled>Modo voz: ON</button>
    <button id="btn-play-pausa" type="button" disabled>Play</button>
    <button id="btn-reiniciar" type="button" disabled>Reiniciar</button>
    <button id="btn-alternar-editor" type="button" disabled>Editar guion</button>
    <button id="btn-alternar-ajustes" type="button" disabled>Ajustes</button>
  </div>

  <div id="zona-voz">
    <p id="mensaje-voz" role="alert" hidden></p>
    <div id="contenedor-nivel-voz">
      <div id="barra-nivel-voz"></div>
    </div>
    <span id="indicador-estado-voz">Silencio</span>
  </div>

  <div id="panel-editor" hidden>
    <textarea id="textarea-guion" placeholder="Escribe o pega tu guion aquí..."></textarea>
    <div id="panel-editor-botones">
      <button id="btn-guardar-guion" type="button">Guardar</button>
      <button id="btn-cerrar-editor" type="button">Ver teleprompter</button>
    </div>
  </div>
  <div id="panel-ajustes" hidden>
    <div class="campo-ajuste">
      <label for="input-tamano-fuente">Tamaño de fuente</label>
      <input id="input-tamano-fuente" type="range" min="0.8" max="3" step="0.05">
    </div>
    <div class="campo-ajuste">
      <label for="input-color-texto">Color del texto</label>
      <input id="input-color-texto" type="color">
    </div>
    <div class="campo-ajuste">
      <label for="input-opacidad-fondo">Opacidad del fondo</label>
      <input id="input-opacidad-fondo" type="range" min="0" max="1" step="0.05">
    </div>
    <div class="campo-ajuste">
      <label for="input-proporcion-camara">Altura del texto superpuesto</label>
      <input id="input-proporcion-camara" type="range" min="15" max="50" step="1">
    </div>
    <div class="campo-ajuste">
      <label for="input-velocidad-base">Velocidad del teleprompter</label>
      <input id="input-velocidad-base" type="range" min="12" max="100" step="1">
    </div>
    <div class="campo-ajuste">
      <label for="select-lente-camara">Cámara / lente</label>
      <select id="select-lente-camara">
        <option value="user">Frontal</option>
        <option value="environment">Trasera</option>
      </select>
    </div>
    <!-- T13, punto 2: preview en vivo, aislado del teleprompter real (no
         depende de js/teleprompter.js) para no interferir con una grabación
         en curso. Se actualiza con las mismas variables CSS y tiene su
         propio ciclo de scroll con la velocidad configurada. -->
    <div class="campo-ajuste" id="campo-preview-ajustes">
      <label for="preview-ajustes-contenedor">Vista previa</label>
      <div id="preview-ajustes-contenedor">
        <div id="preview-ajustes-texto">Así se verá tu guion mientras hablas.</div>
      </div>
    </div>
    <button id="btn-cerrar-ajustes" type="button">Cerrar ajustes</button>
  </div>

  <!-- T14, punto 2: modal obligatorio a pantalla completa. Arranca hidden;
       solo se muestra al detener una grabación (js/camara.js). No tiene
       forma de cerrarse aparte de los dos botones — sin click-fuera, sin
       Escape, sin X. #enlace-descarga se mantiene como mecanismo real detrás
       de "Descargar" (click programático desde camara.js), oculto del layout
       visual (el botón es el que se ve). -->
  <div id="zona-resultado" hidden>
    <video id="video-resultado" controls></video>
    <div id="zona-resultado-botones">
      <button id="btn-descargar-resultado" type="button">Descargar</button>
      <button id="btn-descartar-resultado" type="button">Descartar y grabar de nuevo</button>
    </div>
    <a id="enlace-descarga" download="grabacion.webm" hidden></a>
  </div>

  <script type="module" src="js/camara.js"></script>
  <script type="module" src="js/voz.js"></script>
  <script type="module" src="js/teleprompter.js"></script>
  <script type="module" src="js/editor.js"></script>
  <script type="module" src="js/ajustes.js"></script>
</body>
</html>
