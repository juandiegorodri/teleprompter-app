<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Teleprompter">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>Teleprompter</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div id="zona-camara">
    <video id="video-camara" autoplay playsinline muted></video>
    <p id="mensaje-camara" role="alert" hidden></p>
    <span id="indicador-grabando" hidden>● Grabando</span>
  </div>
  <div id="zona-texto">
    <div id="teleprompter-contenedor">
      <div id="teleprompter-texto"></div>
    </div>
  </div>
  <div id="zona-controles">
    <button id="btn-activar-camara" type="button">Activar cámara</button>
    <button id="btn-grabar" type="button" disabled>Grabar</button>
    <button id="btn-play-pausa" type="button">Play</button>
    <button id="btn-reiniciar" type="button">Reiniciar</button>
    <button id="btn-alternar-editor" type="button">Editar guion</button>
    <button id="btn-activar-voz" type="button">Activar detección de voz</button>
    <button id="btn-modo-voz" type="button" aria-pressed="false">Modo voz: OFF</button>
    <button id="btn-alternar-ajustes" type="button">Ajustes</button>
  </div>

  <div id="zona-voz">
    <p id="mensaje-voz" role="alert" hidden></p>
    <div id="contenedor-nivel-voz">
      <div id="barra-nivel-voz"></div>
    </div>
    <span id="indicador-estado-voz">Silencio</span>
  </div>

  <div id="panel-editor" hidden>
    <textarea id="textarea-guion" placeholder="Escribe o pega tu guion aquí..."></textarea>
    <div id="panel-editor-botones">
      <button id="btn-guardar-guion" type="button">Guardar</button>
      <button id="btn-cerrar-editor" type="button">Ver teleprompter</button>
    </div>
  </div>
  <div id="panel-ajustes" hidden>
    <div class="campo-ajuste">
      <label for="input-tamano-fuente">Tamaño de fuente</label>
      <input id="input-tamano-fuente" type="range" min="0.8" max="3" step="0.05">
    </div>
    <div class="campo-ajuste">
      <label for="input-color-texto">Color del texto</label>
      <input id="input-color-texto" type="color">
    </div>
    <div class="campo-ajuste">
      <label for="input-opacidad-fondo">Opacidad del fondo</label>
      <input id="input-opacidad-fondo" type="range" min="0" max="1" step="0.05">
    </div>
    <div class="campo-ajuste">
      <label for="input-proporcion-camara">Proporción cámara / texto</label>
      <input id="input-proporcion-camara" type="range" min="24" max="70" step="1">
    </div>
    <button id="btn-cerrar-ajustes" type="button">Cerrar ajustes</button>
  </div>

  <div id="zona-resultado">
    <video id="video-resultado" controls hidden></video>
    <a id="enlace-descarga" download="grabacion.webm" hidden>Descargar video</a>
  </div>

  <script type="module" src="js/camara.js"></script>
  <script type="module" src="js/voz.js"></script>
  <script type="module" src="js/teleprompter.js"></script>
  <script type="module" src="js/editor.js"></script>
  <script type="module" src="js/ajustes.js"></script>
</body>
</html>
